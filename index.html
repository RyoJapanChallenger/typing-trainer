<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Typing Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #00ff9d;
    --accent-dim: #00ff9d22;
    --error: #ff3f3f;
    --error-dim: #ff3f3f22;
    --text: #e0e0e0;
    --text-dim: #555566;
    --correct: #00ff9d;
    --pending: #333344;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .stats {
    display: flex;
    gap: 2rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .stat-value { color: var(--accent); font-weight: 700; }

  .main {
    width: 100%;
    max-width: 820px;
    margin-top: 5rem;
  }

  .progress-bar {
    width: 100%;
    height: 2px;
    background: var(--border);
    margin-bottom: 3rem;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
    box-shadow: 0 0 8px var(--accent);
  }

  .progress-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    text-align: right;
    margin-top: 0.4rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 2.5rem;
    margin-bottom: 1.5rem;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
    opacity: 0.6;
  }

  .sentence-number {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-bottom: 1rem;
  }

  .japanese {
    font-size: 1.1rem;
    font-weight: 300;
    color: var(--text);
    line-height: 1.8;
    margin-bottom: 1.5rem;
    letter-spacing: 0.05em;
  }

  .english-display {
    font-family: 'Space Mono', monospace;
    font-size: 1.05rem;
    line-height: 1.8;
    letter-spacing: 0.05em;
    min-height: 2rem;
    margin-bottom: 1rem;
    word-break: break-all;
  }

  .char { display: inline; transition: color 0.05s; }
  .char.correct { color: var(--correct); }
  .char.error { color: var(--error); background: var(--error-dim); border-radius: 2px; }
  .char.pending { color: var(--pending); }
  .char.cursor { border-bottom: 2px solid var(--accent); animation: blink 1s step-end infinite; }

  @keyframes blink {
    0%, 100% { border-color: var(--accent); }
    50% { border-color: transparent; }
  }

  .input-area { position: relative; }

  .input-field {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    padding: 1rem 1.2rem;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 0.05em;
  }

  .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-dim); }
  .input-field.has-error { border-color: var(--error); box-shadow: 0 0 0 1px var(--error-dim); }
  .flash-correct { animation: flashCorrect 0.3s ease; }

  @keyframes flashCorrect {
    0% { border-color: var(--border); }
    50% { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-dim); }
    100% { border-color: var(--border); }
  }

  .hint {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 0.8rem;
    display: flex;
    gap: 2rem;
  }

  .hint kbd {
    background: var(--border);
    border-radius: 2px;
    padding: 0.1rem 0.4rem;
    font-size: 0.65rem;
    color: var(--text);
  }

  .audio-btn {
    position: absolute;
    right: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    padding: 0.3rem;
    transition: color 0.2s;
  }

  .audio-btn:hover { color: var(--accent); }

  /* ===== キーボード ===== */
  .keyboard-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 1.2rem 1.2rem 1rem;
    margin-bottom: 1.5rem;
  }

  .keyboard-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    margin-bottom: 0.9rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.6rem;
    color: var(--text-dim);
    font-family: 'Space Mono', monospace;
  }

  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .kb-row {
    display: flex;
    gap: 3px;
    margin-bottom: 3px;
    justify-content: center;
  }

  .kb-key {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 33px;
    height: 33px;
    border-radius: 3px;
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    color: #55556a;
    background: #0d0d17;
    border: 1px solid #1a1a2a;
    transition: all 0.08s;
    flex-shrink: 0;
    user-select: none;
  }

  .wide-tab   { min-width: 54px; }
  .wide-caps  { min-width: 62px; }
  .wide-shift-l { min-width: 76px; }
  .wide-shift-r { min-width: 94px; }
  .wide-enter { min-width: 76px; }
  .wide-back  { min-width: 68px; }
  .wide-space { min-width: 210px; }

  .f-pl { border-color: #ff6b9d44; }
  .f-rl { border-color: #ff9f4344; }
  .f-ml { border-color: #ffd84344; }
  .f-il { border-color: #43ff8344; }
  .f-ir { border-color: #43d4ff44; }
  .f-mr { border-color: #7c6bff44; }
  .f-rr { border-color: #ff6bff44; }
  .f-pr { border-color: #ff6b6b44; }
  .f-th { border-color: #ffffff18; }

  .hl-pl { background:#ff6b9d20; border-color:#ff6b9d; color:#ff6b9d; box-shadow:0 0 10px #ff6b9d44; }
  .hl-rl { background:#ff9f4320; border-color:#ff9f43; color:#ff9f43; box-shadow:0 0 10px #ff9f4344; }
  .hl-ml { background:#ffd84320; border-color:#ffd843; color:#ffd843; box-shadow:0 0 10px #ffd84344; }
  .hl-il { background:#43ff8320; border-color:#43ff83; color:#43ff83; box-shadow:0 0 10px #43ff8344; }
  .hl-ir { background:#43d4ff20; border-color:#43d4ff; color:#43d4ff; box-shadow:0 0 10px #43d4ff44; }
  .hl-mr { background:#7c6bff20; border-color:#7c6bff; color:#7c6bff; box-shadow:0 0 10px #7c6bff44; }
  .hl-rr { background:#ff6bff20; border-color:#ff6bff; color:#ff6bff; box-shadow:0 0 10px #ff6bff44; }
  .hl-pr { background:#ff6b6b20; border-color:#ff6b6b; color:#ff6b6b; box-shadow:0 0 10px #ff6b6b44; }
  .hl-th { background:#ffffff10; border-color:#ffffff99; color:#ffffff; box-shadow:0 0 10px #ffffff33; }

  /* ===== Result ===== */
  .result-card { display: none; text-align: center; padding: 3rem; }
  .result-card.show { display: block; }

  .result-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    margin-bottom: 2.5rem;
  }

  .result-stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 1.5rem;
  }

  .result-stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    display: block;
  }

  .result-stat-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 0.4rem;
    display: block;
  }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 0.9rem 2.5rem;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }

  .btn:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 20px var(--accent-dim); }
</style>
</head>
<body>

<header>
  <div class="logo">Prompt Typing Trainer</div>
  <div class="stats">
    <span>WPM <span class="stat-value" id="wpm">0</span></span>
    <span>精度 <span class="stat-value" id="accuracy">100</span>%</span>
    <span>ミス <span class="stat-value" id="errors">0</span></span>
  </div>
</header>

<div class="main">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progressLabel">1 / 21</div>

  <div class="card" id="gameCard">
    <div class="sentence-number" id="sentenceNumber">SENTENCE 01</div>
    <div class="japanese" id="japaneseText"></div>
    <div class="english-display" id="englishDisplay"></div>
    <div class="input-area">
      <input type="text" class="input-field" id="inputField"
        autocomplete="off" autocorrect="off" autocapitalize="off"
        spellcheck="false" placeholder="ここにタイピング...">
      <button class="audio-btn" id="audioBtn" title="音声を再生">🔊</button>
    </div>
    <div class="hint">
      <span><kbd>Esc</kbd> 音声再生</span>
    </div>
  </div>

  <div class="keyboard-wrap" id="keyboardWrap">
    <div class="keyboard-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#ff6b9d"></div>小指（左）</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff9f43"></div>薬指（左）</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ffd843"></div>中指（左）</div>
      <div class="legend-item"><div class="legend-dot" style="background:#43ff83"></div>人差し指（左）</div>
      <div class="legend-item"><div class="legend-dot" style="background:#43d4ff"></div>人差し指（右）</div>
      <div class="legend-item"><div class="legend-dot" style="background:#7c6bff"></div>中指（右）</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff6bff"></div>薬指（右）</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff6b6b"></div>小指（右）</div>
    </div>
    <div id="keyboard"></div>
  </div>

  <div class="card result-card" id="resultCard">
    <div class="result-title">Complete</div>
    <div class="result-stats">
      <div class="result-stat">
        <span class="result-stat-value" id="finalWpm">0</span>
        <span class="result-stat-label">WPM</span>
      </div>
      <div class="result-stat">
        <span class="result-stat-value" id="finalAccuracy">0</span>
        <span class="result-stat-label">精度 %</span>
      </div>
      <div class="result-stat">
        <span class="result-stat-value" id="finalErrors">0</span>
        <span class="result-stat-label">総ミス数</span>
      </div>
    </div>
    <button class="btn" id="restartBtn">もう一度</button>
  </div>
</div>

<script>
const sentences = [
  { ja: "必ず日本語で回答せよ。", en: "Please Always respond in Japanese." },
  { ja: "推論プロセスを省略するな。", en: "Please never omit the reasoning process." },
  { ja: "以下の順序で回答せよ。", en: "Please respond in the following order." },
  { ja: "速度より再現性を優先せよ。", en: "Please prioritize reproducibility over speed." },
  { ja: "抽象的な説明を避けよ。", en: "Please avoid abstract explanations." },
  { ja: "最初に結論を要約せよ。", en: "Please summarize the conclusion first." },
  { ja: "必ず根拠プロセスと情報源の根拠を添えること。", en: "Always accompany with the reasoning process and source basis." },
  { ja: "推論を段階的に説明せよ。", en: "Explain the reasoning step by step." },
  { ja: "毎回の回答に例を含めよ。", en: "Include example in every response." },
  { ja: "結果をJSON形式で出力せよ。", en: "Output the result in JSON format." },
  { ja: "ユーザーは初学者であると前提とせよ。", en: "Assume the user is a beginner." },
  { ja: "以下に指定したフォーマットに従え。", en: "Follow the format specified below." },
  { ja: "答えが不明な場合は確認を求めよ。", en: "If the answer is unclear, ask for clarification." },
  { ja: "指定がない限り日本語で回答せよ。", en: "Unless specified, respond in Japanese." },
  { ja: "コードを提供する際は日本語でコメントを付けよ。", en: "When providing code, add comments in Japanese." },
  { ja: "「実務慣行」という表現を避けよ。", en: "Avoid using the phrase \u300c\u5b9f\u52d9\u6163\u884c\u300d." },
  { ja: "明示的な承認なしに前提を変更するな。", en: "Do not modify premises without explicit approval." },
  { ja: "与えられた文脈を超えた推測を慎め。", en: "Refrain from making assumptions beyond the given context." },
  { ja: "回答前に正確性を検証せよ。", en: "Verify the accuracy before responding." },
  { ja: "前提が正しいかどうか確認せよ。", en: "Confirm whether the premise is correct." },
  { ja: "未確認の主張は明示的にフラグを立てよ。", en: "Flag any unverified claims explicitly." }
];

// キーボードレイアウト [表示, キー識別子, 指クラス, 追加クラス]
const KB_ROWS = [
  [['`','`','f-pl'],['1','1','f-pl'],['2','2','f-rl'],['3','3','f-ml'],['4','4','f-il'],['5','5','f-il'],['6','6','f-ir'],['7','7','f-ir'],['8','8','f-mr'],['9','9','f-rr'],['0','0','f-pr'],['-','-','f-pr'],['=','=','f-pr'],['⌫','backspace','f-pr','wide-back']],
  [['Tab','tab','f-pl','wide-tab'],['Q','q','f-pl'],['W','w','f-rl'],['E','e','f-ml'],['R','r','f-il'],['T','t','f-il'],['Y','y','f-ir'],['U','u','f-ir'],['I','i','f-mr'],['O','o','f-rr'],['P','p','f-pr'],['[','[','f-pr'],[']',']','f-pr'],['\\','\\','f-pr']],
  [['Caps','caps','f-pl','wide-caps'],['A','a','f-pl'],['S','s','f-rl'],['D','d','f-ml'],['F','f','f-il'],['G','g','f-il'],['H','h','f-ir'],['J','j','f-ir'],['K','k','f-mr'],['L','l','f-rr'],[';',';','f-pr'],["'","'",'f-pr'],['Enter','enter','f-pr','wide-enter']],
  [['Shift','shift-l','f-pl','wide-shift-l'],['Z','z','f-pl'],['X','x','f-rl'],['C','c','f-ml'],['V','v','f-il'],['B','b','f-il'],['N','n','f-ir'],['M','m','f-ir'],[',',',','f-mr'],['.','.','f-rr'],['/','/','f-pr'],['Shift','shift-r','f-pr','wide-shift-r']],
  [['Space','space','f-th','wide-space']]
];

// キー→指のマッピング
const KEY_FINGER = {};
KB_ROWS.forEach(row => row.forEach(([,key,finger]) => { KEY_FINGER[key] = finger; }));
'abcdefghijklmnopqrstuvwxyz'.split('').forEach(c => { KEY_FINGER[c.toUpperCase()] = KEY_FINGER[c]; });
const SHIFT_SYMBOLS = {'!':'1','@':'2','#':'3','$':'4','%':'5','^':'6','&':'7','*':'8','(':'9',')':'0','_':'-','+':'=','~':'`','{':'[','}':']','|':'\\',':':';','"':"'",'<':',','>':'.','?':'/'};
Object.entries(SHIFT_SYMBOLS).forEach(([s,b]) => { KEY_FINGER[s] = KEY_FINGER[b]; });

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  KB_ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    row.forEach(([label, key, finger, extra]) => {
      const el = document.createElement('div');
      el.className = 'kb-key ' + finger + (extra ? ' ' + extra : '');
      el.textContent = label;
      el.dataset.key = key;
      rowEl.appendChild(el);
    });
    kb.appendChild(rowEl);
  });
}

function clearHighlight() {
  document.querySelectorAll('.kb-key').forEach(el => {
    el.className = el.className.replace(/\bhl-\S+/g, '').trim();
  });
}

function highlightKey(char) {
  clearHighlight();
  if (!char) return;

  const isUpper = char !== char.toLowerCase() && char.toUpperCase() === char;
  const isShiftSym = Object.keys(SHIFT_SYMBOLS).includes(char);
  const baseKey = SHIFT_SYMBOLS[char] || char.toLowerCase();
  const needShift = isUpper || isShiftSym;

  document.querySelectorAll('.kb-key').forEach(el => {
    const k = el.dataset.key;
    if (k === baseKey) {
      const finger = KEY_FINGER[char] || KEY_FINGER[baseKey];
      if (finger) {
        const hlClass = 'hl-' + finger.replace('f-', '');
        el.className = el.className + ' ' + hlClass;
      }
    }
    if (needShift && (k === 'shift-l' || k === 'shift-r')) {
      // 右手の文字は左シフト、左手の文字は右シフトが理想だが、簡略化して両方ハイライト
      el.className = el.className + ' hl-pl';
    }
    if (char === ' ' && k === 'space') {
      el.className = el.className + ' hl-th';
    }
  });
}

// ===== ゲームロジック =====
let current = 0, totalErrors = 0, totalTyped = 0, startTime = null, sessionErrors = 0, typedCorrect = '';

const inputField = document.getElementById('inputField');
const englishDisplay = document.getElementById('englishDisplay');
const japaneseText = document.getElementById('japaneseText');
const sentenceNumber = document.getElementById('sentenceNumber');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const wpmEl = document.getElementById('wpm');
const accuracyEl = document.getElementById('accuracy');
const errorsEl = document.getElementById('errors');
const gameCard = document.getElementById('gameCard');
const resultCard = document.getElementById('resultCard');
const keyboardWrap = document.getElementById('keyboardWrap');

function renderSentence(typed) {
  const target = sentences[current].en;
  let html = '';
  for (let i = 0; i < target.length; i++) {
    let cls = i < typed.length ? (typed[i].toLowerCase() === target[i].toLowerCase() ? 'correct' : 'error') : (i === typed.length ? 'pending cursor' : 'pending');
    const ch = target[i] === ' ' ? '&nbsp;' : target[i];
    html += `<span class="char ${cls}">${ch}</span>`;
  }
  englishDisplay.innerHTML = html;
}

function renderSentenceWithError(correct) {
  const target = sentences[current].en;
  let html = '';
  for (let i = 0; i < target.length; i++) {
    let cls = i < correct.length ? 'correct' : (i === correct.length ? 'error cursor' : 'pending');
    const ch = target[i] === ' ' ? '&nbsp;' : target[i];
    html += `<span class="char ${cls}">${ch}</span>`;
  }
  englishDisplay.innerHTML = html;
}

function loadSentence() {
  const s = sentences[current];
  japaneseText.textContent = s.ja;
  sentenceNumber.textContent = `SENTENCE ${String(current + 1).padStart(2, '0')}`;
  progressFill.style.width = `${(current / sentences.length) * 100}%`;
  progressLabel.textContent = `${current + 1} / ${sentences.length}`;
  inputField.value = '';
  typedCorrect = '';
  sessionErrors = 0;
  renderSentence('');
  highlightKey(s.en[0]);
  inputField.focus();
  speak(s.en);
}

function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-US';
  utt.rate = 0.85;
  speechSynthesis.speak(utt);
}

function updateStats() {
  if (!startTime) return;
  const elapsed = (Date.now() - startTime) / 60000;
  const wpm = elapsed > 0 ? Math.round(totalTyped / 5 / elapsed) : 0;
  const accuracy = totalTyped > 0 ? Math.round(((totalTyped - totalErrors) / totalTyped) * 100) : 100;
  wpmEl.textContent = wpm;
  accuracyEl.textContent = accuracy;
  errorsEl.textContent = totalErrors;
}

function showResult() {
  gameCard.style.display = 'none';
  keyboardWrap.style.display = 'none';
  resultCard.classList.add('show');
  const elapsed = (Date.now() - startTime) / 60000;
  const wpm = elapsed > 0 ? Math.round(totalTyped / 5 / elapsed) : 0;
  const accuracy = totalTyped > 0 ? Math.round(((totalTyped - totalErrors) / totalTyped) * 100) : 100;
  document.getElementById('finalWpm').textContent = wpm;
  document.getElementById('finalAccuracy').textContent = accuracy;
  document.getElementById('finalErrors').textContent = totalErrors;
  clearHighlight();
}

inputField.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { speak(sentences[current].en); return; }
  if (e.key.length !== 1) return;
  e.preventDefault();
  if (!startTime) startTime = Date.now();

  const target = sentences[current].en;
  const pos = typedCorrect.length;
  if (pos >= target.length) return;

  const expectedChar = target[pos];
  totalTyped++;

  if (e.key.toLowerCase() === expectedChar.toLowerCase()) {
    typedCorrect += expectedChar;
    inputField.value = typedCorrect;
    renderSentence(typedCorrect);
    const nextChar = target[typedCorrect.length];
    highlightKey(nextChar !== undefined ? nextChar : null);

    if (typedCorrect.toLowerCase() === target.toLowerCase()) {
      clearHighlight();
      inputField.classList.add('flash-correct');
      setTimeout(() => {
        inputField.classList.remove('flash-correct');
        typedCorrect = '';
        current++;
        if (current >= sentences.length) showResult();
        else loadSentence();
      }, 300);
    }
  } else {
    totalErrors++;
    sessionErrors++;
    inputField.classList.add('has-error');
    setTimeout(() => inputField.classList.remove('has-error'), 150);
    renderSentenceWithError(typedCorrect);
    setTimeout(() => renderSentence(typedCorrect), 300);
  }
  updateStats();
});

document.getElementById('audioBtn').addEventListener('click', () => speak(sentences[current].en));

document.getElementById('restartBtn').addEventListener('click', () => {
  current = 0; totalErrors = 0; totalTyped = 0; startTime = null; typedCorrect = '';
  wpmEl.textContent = '0'; accuracyEl.textContent = '100'; errorsEl.textContent = '0';
  gameCard.style.display = 'block';
  keyboardWrap.style.display = 'block';
  resultCard.classList.remove('show');
  loadSentence();
});

buildKeyboard();
loadSentence();
</script>
</body>
</html>
