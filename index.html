<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Typing Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #00ff9d;
    --accent-dim: #00ff9d22;
    --error: #ff3f3f;
    --error-dim: #ff3f3f22;
    --text: #e0e0e0;
    --text-dim: #555566;
    --correct: #00ff9d;
    --pending: #333344;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .stats {
    display: flex;
    gap: 2rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .stat-value { color: var(--accent); font-weight: 700; }

  .main {
    width: 100%;
    max-width: 820px;
    margin-top: 5rem;
  }

  /* ===== セレクター ===== */
  .selector-wrap {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .selector-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    flex: 1;
  }

  .selector-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .selector {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.85rem;
    padding: 0.6rem 0.8rem;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
    width: 100%;
  }

  .selector:focus { border-color: var(--accent); }
  .selector option { background: var(--surface); }

  .start-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 0.6rem 1.5rem;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    align-self: flex-end;
    white-space: nowrap;
  }

  .start-btn:hover { background: var(--accent); color: var(--bg); }
  .start-btn:disabled { border-color: var(--border); color: var(--text-dim); cursor: not-allowed; }

  /* ===== ローディング ===== */
  .loading {
    text-align: center;
    padding: 2rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    display: none;
  }

  .loading.show { display: block; }

  /* ===== プログレス ===== */
  .progress-bar {
    width: 100%;
    height: 2px;
    background: var(--border);
    margin-bottom: 1rem;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
    box-shadow: 0 0 8px var(--accent);
  }

  .progress-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    text-align: right;
    margin-bottom: 1.5rem;
  }

  /* ===== カード ===== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 2.5rem;
    margin-bottom: 1.5rem;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
    opacity: 0.6;
  }

  .sentence-number {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-bottom: 1rem;
  }

  /* 説明・和訳（D列） */
  .description {
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--text);
    line-height: 1.9;
    margin-bottom: 1.5rem;
    letter-spacing: 0.03em;
    white-space: pre-wrap;
  }

  /* タイピング文（C列）ルビ付き */
  .typing-target {
    font-family: 'Space Mono', monospace;
    font-size: 1.05rem;
    line-height: 2.2;
    letter-spacing: 0.05em;
    min-height: 2rem;
    margin-bottom: 1rem;
    word-break: break-all;
  }

  .char { display: inline; transition: color 0.05s; }
  .char.correct { color: var(--correct); }
  .char.error { color: var(--error); background: var(--error-dim); border-radius: 2px; }
  .char.pending { color: var(--pending); }
  .char.cursor { border-bottom: 2px solid var(--accent); animation: blink 1s step-end infinite; }

  @keyframes blink {
    0%, 100% { border-color: var(--accent); }
    50% { border-color: transparent; }
  }

  /* ルビ */
  ruby { ruby-align: center; }
  rt {
    font-size: 0.5em;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .input-area { position: relative; }

  .input-field {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    padding: 1rem 1.2rem;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 0.05em;
  }

  .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-dim); }
  .input-field.has-error { border-color: var(--error); box-shadow: 0 0 0 1px var(--error-dim); }
  .flash-correct { animation: flashCorrect 0.3s ease; }

  @keyframes flashCorrect {
    0% { border-color: var(--border); }
    50% { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-dim); }
    100% { border-color: var(--border); }
  }

  .hint {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 0.8rem;
    display: flex;
    gap: 2rem;
  }

  .hint kbd {
    background: var(--border);
    border-radius: 2px;
    padding: 0.1rem 0.4rem;
    font-size: 0.65rem;
    color: var(--text);
  }

  .audio-btn {
    position: absolute;
    right: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    padding: 0.3rem;
    transition: color 0.2s;
  }

  .audio-btn:hover { color: var(--accent); }

  /* ===== キーボード ===== */
  .keyboard-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 1.2rem 1.2rem 1rem;
    margin-bottom: 1.5rem;
  }

  .keyboard-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    margin-bottom: 0.9rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.6rem;
    color: var(--text-dim);
    font-family: 'Space Mono', monospace;
  }

  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .kb-row { display: flex; gap: 3px; margin-bottom: 3px; justify-content: center; }

  .kb-key {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 33px;
    height: 33px;
    border-radius: 3px;
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    color: #55556a;
    background: #0d0d17;
    border: 1px solid #1a1a2a;
    transition: all 0.08s;
    flex-shrink: 0;
    user-select: none;
  }

  .wide-tab { min-width: 54px; }
  .wide-caps { min-width: 62px; }
  .wide-shift-l { min-width: 76px; }
  .wide-shift-r { min-width: 94px; }
  .wide-enter { min-width: 76px; }
  .wide-back { min-width: 68px; }
  .wide-space { min-width: 210px; }

  .f-pl { border-color: #ff6b9d44; }
  .f-rl { border-color: #ff9f4344; }
  .f-ml { border-color: #ffd84344; }
  .f-il { border-color: #43ff8344; }
  .f-ir { border-color: #43d4ff44; }
  .f-mr { border-color: #7c6bff44; }
  .f-rr { border-color: #ff6bff44; }
  .f-pr { border-color: #ff6b6b44; }
  .f-th { border-color: #ffffff18; }

  .hl-pl { background:#ff6b9d20; border-color:#ff6b9d; color:#ff6b9d; box-shadow:0 0 10px #ff6b9d44; }
  .hl-rl { background:#ff9f4320; border-color:#ff9f43; color:#ff9f43; box-shadow:0 0 10px #ff9f4344; }
  .hl-ml { background:#ffd84320; border-color:#ffd843; color:#ffd843; box-shadow:0 0 10px #ffd84344; }
  .hl-il { background:#43ff8320; border-color:#43ff83; color:#43ff83; box-shadow:0 0 10px #43ff8344; }
  .hl-ir { background:#43d4ff20; border-color:#43d4ff; color:#43d4ff; box-shadow:0 0 10px #43d4ff44; }
  .hl-mr { background:#7c6bff20; border-color:#7c6bff; color:#7c6bff; box-shadow:0 0 10px #7c6bff44; }
  .hl-rr { background:#ff6bff20; border-color:#ff6bff; color:#ff6bff; box-shadow:0 0 10px #ff6bff44; }
  .hl-pr { background:#ff6b6b20; border-color:#ff6b6b; color:#ff6b6b; box-shadow:0 0 10px #ff6b6b44; }
  .hl-th { background:#ffffff10; border-color:#ffffff99; color:#ffffff; box-shadow:0 0 10px #ffffff33; }

  /* ===== Result ===== */
  .result-card { display: none; text-align: center; padding: 3rem; }
  .result-card.show { display: block; }

  .result-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    margin-bottom: 2.5rem;
  }

  .result-stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 1.5rem;
  }

  .result-stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    display: block;
  }

  .result-stat-label { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.4rem; display: block; }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 0.9rem 2.5rem;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    margin: 0.5rem;
  }

  .btn:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 20px var(--accent-dim); }

  .game-controls { margin-bottom: 1.5rem; }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.4rem;
  }

  .game-btns { display: flex; gap: 0.6rem; }

  .game-ctrl-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 0.4rem 0.9rem;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .game-ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
  .game-ctrl-btn.danger:hover { border-color: var(--error); color: var(--error); }

  /* 一時停止オーバーレイ */
  .pause-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,10,15,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .pause-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 3rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 280px;
  }

  .pause-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="logo">Prompt Typing Trainer</div>
  <div class="stats">
    <span>WPM <span class="stat-value" id="wpm">0</span></span>
    <span>精度 <span class="stat-value" id="accuracy">100</span>%</span>
    <span>ミス <span class="stat-value" id="errors">0</span></span>
  </div>
</header>

<div class="main">

  <!-- セレクター -->
  <div class="selector-wrap" id="selectorWrap">
    <div class="selector-group">
      <div class="selector-label">分野</div>
      <select class="selector" id="sheetSelect">
        <option value="">読み込み中...</option>
      </select>
    </div>
    <div class="selector-group">
      <div class="selector-label">単元</div>
      <select class="selector" id="unitSelect">
        <option value="">分野を選択してください</option>
      </select>
    </div>
    <button class="start-btn" id="startBtn" disabled>START</button>
  </div>

  <div class="loading" id="loading">データを読み込み中...</div>

  <!-- ゲーム -->
  <div id="gameArea" class="hidden">
    <div class="game-controls">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="progress-row">
        <div class="progress-label" id="progressLabel">1 / 0</div>
        <div class="game-btns">
          <button class="game-ctrl-btn" id="pauseBtn">⏸ 一時停止</button>
          <button class="game-ctrl-btn danger" id="backToSelectBtn">✕ 分野選択に戻る</button>
        </div>
      </div>
    </div>

    <!-- 一時停止オーバーレイ -->
    <div class="pause-overlay hidden" id="pauseOverlay">
      <div class="pause-box">
        <div class="pause-title">一時停止中</div>
        <button class="btn" id="resumeBtn">▶ 再開</button>
        <button class="btn" id="pauseBackBtn">分野選択に戻る</button>
      </div>
    </div>

    <div class="card" id="gameCard">
      <div class="sentence-number" id="sentenceNumber">SENTENCE 01</div>
      <div class="description" id="descriptionText"></div>
      <div class="typing-target" id="typingDisplay"></div>
      <div class="input-area">
        <input type="text" class="input-field" id="inputField"
          autocomplete="off" autocorrect="off" autocapitalize="off"
          spellcheck="false" placeholder="ここにタイピング...">
        <button class="audio-btn" id="audioBtn" title="音声を再生">🔊</button>
      </div>
      <div class="hint">
        <span><kbd>Esc</kbd> 音声再生</span>
      </div>
    </div>

    <div class="keyboard-wrap" id="keyboardWrap">
      <div class="keyboard-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#ff6b9d"></div>小指（左）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff9f43"></div>薬指（左）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ffd843"></div>中指（左）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#43ff83"></div>人差し指（左）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#43d4ff"></div>人差し指（右）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#7c6bff"></div>中指（右）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff6bff"></div>薬指（右）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff6b6b"></div>小指（右）</div>
      </div>
      <div id="keyboard"></div>
    </div>
  </div>

  <!-- リザルト -->
  <div class="card result-card" id="resultCard">
    <div class="result-title">Complete</div>
    <div class="result-stats">
      <div class="result-stat">
        <span class="result-stat-value" id="finalWpm">0</span>
        <span class="result-stat-label">WPM</span>
      </div>
      <div class="result-stat">
        <span class="result-stat-value" id="finalAccuracy">0</span>
        <span class="result-stat-label">精度 %</span>
      </div>
      <div class="result-stat">
        <span class="result-stat-value" id="finalErrors">0</span>
        <span class="result-stat-label">総ミス数</span>
      </div>
    </div>
    <button class="btn" id="retryBtn">もう一度</button>
    <button class="btn" id="backBtn">分野選択に戻る</button>
  </div>

</div>

<script>
// ===== 設定 =====
const GAS_URL = "https://script.google.com/macros/s/AKfycbwqWwFSr1cRDAlKTBeCFwFxEprf-kXhJyJ2uvsAWRC0kV_f8F51rGcv9oI7yABO0AQp/exec";

// ===== キーボードレイアウト =====
const KB_ROWS = [
  [['`','`','f-pl'],['1','1','f-pl'],['2','2','f-rl'],['3','3','f-ml'],['4','4','f-il'],['5','5','f-il'],['6','6','f-ir'],['7','7','f-ir'],['8','8','f-mr'],['9','9','f-rr'],['0','0','f-pr'],['-','-','f-pr'],['=','=','f-pr'],['⌫','backspace','f-pr','wide-back']],
  [['Tab','tab','f-pl','wide-tab'],['Q','q','f-pl'],['W','w','f-rl'],['E','e','f-ml'],['R','r','f-il'],['T','t','f-il'],['Y','y','f-ir'],['U','u','f-ir'],['I','i','f-mr'],['O','o','f-rr'],['P','p','f-pr'],['[','[','f-pr'],[']',']','f-pr'],['\\','\\','f-pr']],
  [['Caps','caps','f-pl','wide-caps'],['A','a','f-pl'],['S','s','f-rl'],['D','d','f-ml'],['F','f','f-il'],['G','g','f-il'],['H','h','f-ir'],['J','j','f-ir'],['K','k','f-mr'],['L','l','f-rr'],[';',';','f-pr'],["'","'",'f-pr'],['Enter','enter','f-pr','wide-enter']],
  [['Shift','shift-l','f-pl','wide-shift-l'],['Z','z','f-pl'],['X','x','f-rl'],['C','c','f-ml'],['V','v','f-il'],['B','b','f-il'],['N','n','f-ir'],['M','m','f-ir'],[',',',','f-mr'],['.','.','f-rr'],['/','/','f-pr'],['Shift','shift-r','f-pr','wide-shift-r']],
  [['Space','space','f-th','wide-space']]
];

const KEY_FINGER = {};
KB_ROWS.forEach(row => row.forEach(([,key,finger]) => { KEY_FINGER[key] = finger; }));
'abcdefghijklmnopqrstuvwxyz'.split('').forEach(c => { KEY_FINGER[c.toUpperCase()] = KEY_FINGER[c]; });
const SHIFT_SYMBOLS = {'!':'1','@':'2','#':'3','$':'4','%':'5','^':'6','&':'7','*':'8','(':'9',')':'0','_':'-','+':'=','~':'`','{':'[','}':']','|':'\\',':':';','"':"'",'<':',','>':'.','?':'/'};
Object.entries(SHIFT_SYMBOLS).forEach(([s,b]) => { KEY_FINGER[s] = KEY_FINGER[b]; });

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  KB_ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    row.forEach(([label, key, finger, extra]) => {
      const el = document.createElement('div');
      el.className = 'kb-key ' + finger + (extra ? ' ' + extra : '');
      el.textContent = label;
      el.dataset.key = key;
      rowEl.appendChild(el);
    });
    kb.appendChild(rowEl);
  });
}

function clearHighlight() {
  document.querySelectorAll('.kb-key').forEach(el => {
    el.className = el.className.replace(/\bhl-\S+/g, '').trim();
  });
}

function highlightKey(char) {
  clearHighlight();
  if (!char) return;
  const isUpper = char !== char.toLowerCase() && char === char.toUpperCase();
  const isShiftSym = Object.keys(SHIFT_SYMBOLS).includes(char);
  const baseKey = SHIFT_SYMBOLS[char] || char.toLowerCase();
  const needShift = isUpper || isShiftSym;

  document.querySelectorAll('.kb-key').forEach(el => {
    const k = el.dataset.key;
    if (k === baseKey) {
      const finger = KEY_FINGER[char] || KEY_FINGER[baseKey];
      if (finger) el.className = el.className + ' hl-' + finger.replace('f-', '');
    }
    if (needShift && (k === 'shift-l' || k === 'shift-r')) {
      el.className = el.className + ' hl-pl';
    }
    if (char === ' ' && k === 'space') {
      el.className = el.className + ' hl-th';
    }
  });
}

// ===== データ取得 =====
let allData = {};

function fetchJsonp(url) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    window[cbName] = (data) => {
      delete window[cbName];
      document.body.removeChild(script);
      resolve(data);
    };
    script.onerror = () => {
      delete window[cbName];
      document.body.removeChild(script);
      reject(new Error('JSONP failed'));
    };
    script.src = url + '&callback=' + cbName;
    document.body.appendChild(script);
  });
}

async function fetchSheet(sheetName) {
  const url = GAS_URL + '?sheet=' + encodeURIComponent(sheetName);
  const data = await fetchJsonp(url);
  return data;
}

async function loadAllSheets() {
  document.getElementById('loading').classList.add('show');
  try {
    const sheetNames = await fetchJsonp(GAS_URL + '?');
    for (const name of sheetNames) {
      try {
        allData[name] = await fetchSheet(name);
      } catch(e) {
        allData[name] = [];
      }
    }
  } catch(e) {
    console.error('データ取得エラー:', e);
  }
  document.getElementById('loading').classList.remove('show');
  setupSheetSelect();
}

function setupSheetSelect() {
  const sel = document.getElementById('sheetSelect');
  sel.innerHTML = '';
  Object.keys(allData).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
  onSheetChange();
}

function onSheetChange() {
  const sheetName = document.getElementById('sheetSelect').value;
  const data = allData[sheetName] || [];
  const units = [...new Set(data.map(d => d.unit).filter(u => u))];
  const unitSel = document.getElementById('unitSelect');
  unitSel.innerHTML = '';

  // 「すべて」オプション
  const allOpt = document.createElement('option');
  allOpt.value = '__all__';
  allOpt.textContent = 'すべて';
  unitSel.appendChild(allOpt);

  units.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u;
    opt.textContent = u;
    unitSel.appendChild(opt);
  });

  document.getElementById('startBtn').disabled = data.length === 0;
}

// ===== ゲームロジック =====
let sentences = [];
let current = 0, totalErrors = 0, totalTyped = 0, startTime = null, typedCorrect = '';
let isPaused = false;

const inputField = document.getElementById('inputField');

function getCurrentSentences() {
  const sheetName = document.getElementById('sheetSelect').value;
  const unit = document.getElementById('unitSelect').value;
  const data = allData[sheetName] || [];
  if (unit === '__all__') return data;
  return data.filter(d => d.unit === unit);
}

function startGame() {
  sentences = getCurrentSentences();
  if (sentences.length === 0) return;

  // シャッフル
  sentences = sentences.sort(() => Math.random() - 0.5);

  current = 0; totalErrors = 0; totalTyped = 0; startTime = null; typedCorrect = ''; isPaused = false;
  document.getElementById('wpm').textContent = '0';
  document.getElementById('accuracy').textContent = '100';
  document.getElementById('errors').textContent = '0';

  document.getElementById('selectorWrap').classList.add('hidden');
  document.getElementById('gameArea').classList.remove('hidden');
  document.getElementById('resultCard').classList.remove('show');

  loadSentence();
}

// ルビHTML生成
function buildTypingHTML(typing, ruby) {
  if (!ruby) {
    // ルビなし：文字ごとにspanを生成（後でcharクラスを付ける）
    return null; // renderSentenceで処理
  }
  // ルビあり：rubyタグで囲む（タイピング対象はtextContentで取得）
  return `<ruby>${typing}<rt>${ruby}</rt></ruby>`;
}

function renderSentence(typed) {
  const s = sentences[current];
  const target = s.typing;
  const ruby = s.ruby;
  const display = document.getElementById('typingDisplay');

  if (ruby) {
    // ルビあり：文字ごとにspanを分けてルビを付ける
    let html = '';
    for (let i = 0; i < target.length; i++) {
      let cls = i < typed.length
        ? (typed[i].toLowerCase() === target[i].toLowerCase() ? 'correct' : 'error')
        : (i === typed.length ? 'pending cursor' : 'pending');
      const ch = target[i] === ' ' ? '&nbsp;' : target[i];
      const rt = ruby[i] || '';
      if (rt) {
        html += `<ruby><span class="char ${cls}">${ch}</span><rt>${rt}</rt></ruby>`;
      } else {
        html += `<span class="char ${cls}">${ch}</span>`;
      }
    }
    display.innerHTML = html;
  } else {
    let html = '';
    for (let i = 0; i < target.length; i++) {
      let cls = i < typed.length
        ? (typed[i].toLowerCase() === target[i].toLowerCase() ? 'correct' : 'error')
        : (i === typed.length ? 'pending cursor' : 'pending');
      const ch = target[i] === ' ' ? '&nbsp;' : target[i];
      html += `<span class="char ${cls}">${ch}</span>`;
    }
    display.innerHTML = html;
  }
}

function renderSentenceWithError(correct) {
  const s = sentences[current];
  const target = s.typing;
  const ruby = s.ruby;
  const display = document.getElementById('typingDisplay');
  let html = '';
  for (let i = 0; i < target.length; i++) {
    let cls = i < correct.length ? 'correct' : (i === correct.length ? 'error cursor' : 'pending');
    const ch = target[i] === ' ' ? '&nbsp;' : target[i];
    if (ruby && ruby[i]) {
      html += `<ruby><span class="char ${cls}">${ch}</span><rt>${ruby[i]}</rt></ruby>`;
    } else {
      html += `<span class="char ${cls}">${ch}</span>`;
    }
  }
  display.innerHTML = html;
}

function loadSentence() {
  const s = sentences[current];
  document.getElementById('sentenceNumber').textContent = `SENTENCE ${String(current + 1).padStart(2, '0')}`;
  document.getElementById('progressFill').style.width = `${(current / sentences.length) * 100}%`;
  document.getElementById('progressLabel').textContent = `${current + 1} / ${sentences.length}`;
  document.getElementById('descriptionText').textContent = s.desc || '';
  inputField.value = '';
  typedCorrect = '';
  renderSentence('');
  highlightKey(s.typing[0]);
  inputField.focus();
  speak(s.typing);
}

function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'ja-JP'; // 日本語も対応
  utt.rate = 0.85;
  speechSynthesis.speak(utt);
}

function updateStats() {
  if (!startTime) return;
  const elapsed = (Date.now() - startTime) / 60000;
  const wpm = elapsed > 0 ? Math.round(totalTyped / 5 / elapsed) : 0;
  const accuracy = totalTyped > 0 ? Math.round(((totalTyped - totalErrors) / totalTyped) * 100) : 100;
  document.getElementById('wpm').textContent = wpm;
  document.getElementById('accuracy').textContent = accuracy;
  document.getElementById('errors').textContent = totalErrors;
}

function showResult() {
  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('resultCard').classList.add('show');
  const elapsed = (Date.now() - startTime) / 60000;
  const wpm = elapsed > 0 ? Math.round(totalTyped / 5 / elapsed) : 0;
  const accuracy = totalTyped > 0 ? Math.round(((totalTyped - totalErrors) / totalTyped) * 100) : 100;
  document.getElementById('finalWpm').textContent = wpm;
  document.getElementById('finalAccuracy').textContent = accuracy;
  document.getElementById('finalErrors').textContent = totalErrors;
  clearHighlight();
}

inputField.addEventListener('keydown', (e) => {
  if (isPaused) return;
  if (e.key === 'Escape') { speak(sentences[current].typing); return; }
  if (e.key.length !== 1) return;
  e.preventDefault();
  if (!startTime) startTime = Date.now();

  const target = sentences[current].typing;
  const pos = typedCorrect.length;
  if (pos >= target.length) return;

  const expectedChar = target[pos];
  totalTyped++;

  if (e.key.toLowerCase() === expectedChar.toLowerCase()) {
    typedCorrect += expectedChar;
    inputField.value = typedCorrect;
    renderSentence(typedCorrect);
    const nextChar = target[typedCorrect.length];
    highlightKey(nextChar !== undefined ? nextChar : null);

    if (typedCorrect.toLowerCase() === target.toLowerCase()) {
      clearHighlight();
      inputField.classList.add('flash-correct');
      setTimeout(() => {
        inputField.classList.remove('flash-correct');
        typedCorrect = '';
        current++;
        if (current >= sentences.length) showResult();
        else loadSentence();
      }, 300);
    }
  } else {
    totalErrors++;
    inputField.classList.add('has-error');
    setTimeout(() => inputField.classList.remove('has-error'), 150);
    renderSentenceWithError(typedCorrect);
    setTimeout(() => renderSentence(typedCorrect), 300);
  }
  updateStats();
});

function goToSelector() {
  isPaused = false;
  document.getElementById('pauseOverlay').classList.add('hidden');
  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('selectorWrap').classList.remove('hidden');
  clearHighlight();
  speechSynthesis.cancel();
}

// 一時停止
document.getElementById('pauseBtn').addEventListener('click', () => {
  isPaused = true;
  speechSynthesis.cancel();
  document.getElementById('pauseOverlay').classList.remove('hidden');
  inputField.blur();
});

// 再開
document.getElementById('resumeBtn').addEventListener('click', () => {
  isPaused = false;
  document.getElementById('pauseOverlay').classList.add('hidden');
  inputField.focus();
});

// 一時停止後→分野選択に戻る
document.getElementById('pauseBackBtn').addEventListener('click', goToSelector);

// 直接→分野選択に戻る
document.getElementById('backToSelectBtn').addEventListener('click', goToSelector);

document.getElementById('audioBtn').addEventListener('click', () => speak(sentences[current].typing));
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('sheetSelect').addEventListener('change', onSheetChange);

document.getElementById('retryBtn').addEventListener('click', () => {
  document.getElementById('resultCard').classList.remove('show');
  startGame();
});

document.getElementById('backBtn').addEventListener('click', goToSelector);

// ===== 初期化 =====
buildKeyboard();
loadAllSheets();
</script>
</body>
</html>
