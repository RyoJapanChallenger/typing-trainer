<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Typing Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #00ff9d;
    --accent-dim: #00ff9d22;
    --error: #ff3f3f;
    --error-dim: #ff3f3f22;
    --text: #e0e0e0;
    --text-dim: #555566;
    --correct: #00ff9d;
    --pending: #333344;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .stats {
    display: flex;
    gap: 2rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .stat-value { color: var(--accent); font-weight: 700; }

  .main {
    width: 100%;
    max-width: 820px;
    margin-top: 5rem;
  }

  /* ===== セレクター ===== */
  .selector-wrap {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .selector-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    flex: 1;
  }

  .selector-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .selector {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.85rem;
    padding: 0.6rem 0.8rem;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
    width: 100%;
  }

  .selector:focus { border-color: var(--accent); }
  .selector option { background: var(--surface); }

  .start-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 0.6rem 1.5rem;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    align-self: flex-end;
    white-space: nowrap;
  }

  .start-btn:hover { background: var(--accent); color: var(--bg); }
  .start-btn:disabled { border-color: var(--border); color: var(--text-dim); cursor: not-allowed; }

  /* ===== ローディング ===== */
  .loading {
    text-align: center;
    padding: 2rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    display: none;
  }

  .loading.show { display: block; }

  /* ===== プログレス ===== */
  .progress-bar {
    width: 100%;
    height: 2px;
    background: var(--border);
    margin-bottom: 1rem;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
    box-shadow: 0 0 8px var(--accent);
  }

  .progress-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    text-align: right;
    margin-bottom: 1.5rem;
  }

  /* ===== カード ===== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 2.5rem;
    margin-bottom: 1.5rem;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
    opacity: 0.6;
  }

  .sentence-number {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-bottom: 1rem;
  }

  /* 説明・和訳（D列） */
  .description {
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--text);
    line-height: 1.9;
    margin-bottom: 0.8rem;
    letter-spacing: 0.03em;
    white-space: pre-wrap;
  }

  /* C列：表示用テキスト（漢字混じり・ルビ付き） */
  .display-text {
    font-size: 1.2rem;
    font-weight: 400;
    color: var(--text);
    line-height: 2.2;
    margin-bottom: 1rem;
    letter-spacing: 0.05em;
    min-height: 1.5rem;
  }

  /* タイピング文（C列）ルビ付き */
  .typing-target {
    font-family: 'Space Mono', monospace;
    font-size: 1.05rem;
    line-height: 2.2;
    letter-spacing: 0.05em;
    min-height: 2rem;
    margin-bottom: 1rem;
    word-break: break-all;
  }

  .char { display: inline; transition: color 0.05s; }
  .char.correct { color: var(--correct); }
  .char.error { color: var(--error); background: var(--error-dim); border-radius: 2px; }
  .char.pending { color: var(--pending); }
  .char.cursor { border-bottom: 2px solid var(--accent); animation: blink 1s step-end infinite; }

  @keyframes blink {
    0%, 100% { border-color: var(--accent); }
    50% { border-color: transparent; }
  }

  /* ルビ */
  ruby { ruby-align: center; }
  rt {
    font-size: 0.5em;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .input-area { position: relative; }

  .input-field {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    padding: 1rem 1.2rem;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 0.05em;
  }

  .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-dim); }
  .input-field.has-error { border-color: var(--error); box-shadow: 0 0 0 1px var(--error-dim); }
  .flash-correct { animation: flashCorrect 0.3s ease; }

  @keyframes flashCorrect {
    0% { border-color: var(--border); }
    50% { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-dim); }
    100% { border-color: var(--border); }
  }

  .hint {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 0.8rem;
    display: flex;
    gap: 2rem;
  }

  .hint kbd {
    background: var(--border);
    border-radius: 2px;
    padding: 0.1rem 0.4rem;
    font-size: 0.65rem;
    color: var(--text);
  }

  .audio-btn {
    position: absolute;
    right: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    padding: 0.3rem;
    transition: color 0.2s;
  }

  .audio-btn:hover { color: var(--accent); }

  /* ===== キーボード ===== */
  .keyboard-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 1.2rem 1.2rem 1rem;
    margin-bottom: 1.5rem;
  }

  .keyboard-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    margin-bottom: 0.9rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.6rem;
    color: var(--text-dim);
    font-family: 'Space Mono', monospace;
  }

  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .kb-row { display: flex; gap: 3px; margin-bottom: 3px; justify-content: center; }

  .kb-key {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 33px;
    height: 33px;
    border-radius: 3px;
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    color: #55556a;
    background: #0d0d17;
    border: 1px solid #1a1a2a;
    transition: all 0.08s;
    flex-shrink: 0;
    user-select: none;
  }

  .wide-tab { min-width: 54px; }
  .wide-caps { min-width: 62px; }
  .wide-shift-l { min-width: 76px; }
  .wide-shift-r { min-width: 94px; }
  .wide-enter { min-width: 76px; }
  .wide-back { min-width: 68px; }
  .wide-space { min-width: 210px; }

  .f-pl { border-color: #ff6b9d44; }
  .f-rl { border-color: #ff9f4344; }
  .f-ml { border-color: #ffd84344; }
  .f-il { border-color: #43ff8344; }
  .f-ir { border-color: #43d4ff44; }
  .f-mr { border-color: #7c6bff44; }
  .f-rr { border-color: #ff6bff44; }
  .f-pr { border-color: #ff6b6b44; }
  .f-th { border-color: #ffffff18; }

  .hl-pl { background:#ff6b9d20; border-color:#ff6b9d; color:#ff6b9d; box-shadow:0 0 10px #ff6b9d44; }
  .hl-rl { background:#ff9f4320; border-color:#ff9f43; color:#ff9f43; box-shadow:0 0 10px #ff9f4344; }
  .hl-ml { background:#ffd84320; border-color:#ffd843; color:#ffd843; box-shadow:0 0 10px #ffd84344; }
  .hl-il { background:#43ff8320; border-color:#43ff83; color:#43ff83; box-shadow:0 0 10px #43ff8344; }
  .hl-ir { background:#43d4ff20; border-color:#43d4ff; color:#43d4ff; box-shadow:0 0 10px #43d4ff44; }
  .hl-mr { background:#7c6bff20; border-color:#7c6bff; color:#7c6bff; box-shadow:0 0 10px #7c6bff44; }
  .hl-rr { background:#ff6bff20; border-color:#ff6bff; color:#ff6bff; box-shadow:0 0 10px #ff6bff44; }
  .hl-pr { background:#ff6b6b20; border-color:#ff6b6b; color:#ff6b6b; box-shadow:0 0 10px #ff6b6b44; }
  .hl-th { background:#ffffff10; border-color:#ffffff99; color:#ffffff; box-shadow:0 0 10px #ffffff33; }

  /* ===== Result ===== */
  .result-card { display: none; text-align: center; padding: 3rem; }
  .result-card.show { display: block; }

  .result-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .result-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    margin-bottom: 2.5rem;
  }

  .result-stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 1.5rem;
  }

  .result-stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    display: block;
  }

  .result-stat-label { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.4rem; display: block; }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 0.9rem 2.5rem;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    margin: 0.5rem;
  }

  .btn:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 20px var(--accent-dim); }

  .game-controls { margin-bottom: 1.5rem; }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.4rem;
  }

  .game-btns { display: flex; gap: 0.6rem; }

  .game-ctrl-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 0.4rem 0.9rem;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .game-ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
  .game-ctrl-btn.danger:hover { border-color: var(--error); color: var(--error); }

  /* 一時停止オーバーレイ */
  .pause-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,10,15,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .pause-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 3rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 280px;
  }

  .pause-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .romaji-buf {
    font-family: 'Space Mono', monospace;
    font-size: 0.85em;
    color: var(--accent);
    border-bottom: 1px dashed var(--accent);
    margin-left: 2px;
    letter-spacing: 0.05em;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="logo">Prompt Typing Trainer</div>
  <div class="stats">
    <span>WPM <span class="stat-value" id="wpm">0</span></span>
    <span>精度 <span class="stat-value" id="accuracy">100</span>%</span>
    <span>ミス <span class="stat-value" id="errors">0</span></span>
  </div>
</header>

<div class="main">

  <!-- セレクター -->
  <div class="selector-wrap" id="selectorWrap">
    <div class="selector-group">
      <div class="selector-label">分野</div>
      <select class="selector" id="sheetSelect">
        <option value="">読み込み中...</option>
      </select>
    </div>
    <div class="selector-group">
      <div class="selector-label">単元</div>
      <select class="selector" id="unitSelect">
        <option value="">分野を選択してください</option>
      </select>
    </div>
    <button class="start-btn" id="startBtn" disabled>START</button>
  </div>

  <div class="loading" id="loading">データを読み込み中...</div>

  <!-- ゲーム -->
  <div id="gameArea" class="hidden">
    <div class="game-controls">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="progress-row">
        <div class="progress-label" id="progressLabel">1 / 0</div>
        <div class="game-btns">
          <button class="game-ctrl-btn" id="pauseBtn">⏸ 一時停止</button>
          <button class="game-ctrl-btn danger" id="backToSelectBtn">✕ 分野選択に戻る</button>
        </div>
      </div>
    </div>

    <!-- 一時停止オーバーレイ -->
    <div class="pause-overlay hidden" id="pauseOverlay">
      <div class="pause-box">
        <div class="pause-title">一時停止中</div>
        <button class="btn" id="resumeBtn">▶ 再開</button>
        <button class="btn" id="pauseBackBtn">分野選択に戻る</button>
      </div>
    </div>

    <div class="card" id="gameCard">
      <div class="sentence-number" id="sentenceNumber">SENTENCE 01</div>
      <div class="description" id="descriptionText"></div>
      <div class="display-text" id="displayText"></div>
      <div class="typing-target" id="typingDisplay"></div>
      <div class="input-area">
        <input type="text" class="input-field" id="inputField"
          autocomplete="off" autocorrect="off" autocapitalize="off"
          spellcheck="false" placeholder="ここにタイピング...">
        <button class="audio-btn" id="audioBtn" title="音声を再生">🔊</button>
      </div>
      <div class="hint">
        <span><kbd>Esc</kbd> 音声再生</span>
      </div>
    </div>

    <div class="keyboard-wrap" id="keyboardWrap">
      <div class="keyboard-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#ff6b9d"></div>小指（左）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff9f43"></div>薬指（左）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ffd843"></div>中指（左）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#43ff83"></div>人差し指（左）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#43d4ff"></div>人差し指（右）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#7c6bff"></div>中指（右）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff6bff"></div>薬指（右）</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff6b6b"></div>小指（右）</div>
      </div>
      <div id="keyboard"></div>
    </div>
  </div>

  <!-- リザルト -->
  <div class="card result-card" id="resultCard">
    <div class="result-title">Complete</div>
    <div class="result-stats">
      <div class="result-stat">
        <span class="result-stat-value" id="finalWpm">0</span>
        <span class="result-stat-label">WPM</span>
      </div>
      <div class="result-stat">
        <span class="result-stat-value" id="finalAccuracy">0</span>
        <span class="result-stat-label">精度 %</span>
      </div>
      <div class="result-stat">
        <span class="result-stat-value" id="finalErrors">0</span>
        <span class="result-stat-label">総ミス数</span>
      </div>
    </div>
    <button class="btn" id="retryBtn">もう一度</button>
    <button class="btn" id="backBtn">分野選択に戻る</button>
  </div>

</div>

<script>
// ===== 設定 =====
const GAS_URL = "https://script.google.com/macros/s/AKfycbwqWwFSr1cRDAlKTBeCFwFxEprf-kXhJyJ2uvsAWRC0kV_f8F51rGcv9oI7yABO0AQp/exec";

// ===== キーボードレイアウト =====
const KB_ROWS = [
  [['`','`','f-pl'],['1','1','f-pl'],['2','2','f-rl'],['3','3','f-ml'],['4','4','f-il'],['5','5','f-il'],['6','6','f-ir'],['7','7','f-ir'],['8','8','f-mr'],['9','9','f-rr'],['0','0','f-pr'],['-','-','f-pr'],['=','=','f-pr'],['⌫','backspace','f-pr','wide-back']],
  [['Tab','tab','f-pl','wide-tab'],['Q','q','f-pl'],['W','w','f-rl'],['E','e','f-ml'],['R','r','f-il'],['T','t','f-il'],['Y','y','f-ir'],['U','u','f-ir'],['I','i','f-mr'],['O','o','f-rr'],['P','p','f-pr'],['[','[','f-pr'],[']',']','f-pr'],['\\','\\','f-pr']],
  [['Caps','caps','f-pl','wide-caps'],['A','a','f-pl'],['S','s','f-rl'],['D','d','f-ml'],['F','f','f-il'],['G','g','f-il'],['H','h','f-ir'],['J','j','f-ir'],['K','k','f-mr'],['L','l','f-rr'],[';',';','f-pr'],["'","'",'f-pr'],['Enter','enter','f-pr','wide-enter']],
  [['Shift','shift-l','f-pl','wide-shift-l'],['Z','z','f-pl'],['X','x','f-rl'],['C','c','f-ml'],['V','v','f-il'],['B','b','f-il'],['N','n','f-ir'],['M','m','f-ir'],[',',',','f-mr'],['.','.','f-rr'],['/','/','f-pr'],['Shift','shift-r','f-pr','wide-shift-r']],
  [['Space','space','f-th','wide-space']]
];

const KEY_FINGER = {};
KB_ROWS.forEach(row => row.forEach(([,key,finger]) => { KEY_FINGER[key] = finger; }));
'abcdefghijklmnopqrstuvwxyz'.split('').forEach(c => { KEY_FINGER[c.toUpperCase()] = KEY_FINGER[c]; });
const SHIFT_SYMBOLS = {'!':'1','@':'2','#':'3','$':'4','%':'5','^':'6','&':'7','*':'8','(':'9',')':'0','_':'-','+':'=','~':'`','{':'[','}':']','|':'\\',':':';','"':"'",'<':',','>':'.','?':'/'};
Object.entries(SHIFT_SYMBOLS).forEach(([s,b]) => { KEY_FINGER[s] = KEY_FINGER[b]; });

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  KB_ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    row.forEach(([label, key, finger, extra]) => {
      const el = document.createElement('div');
      el.className = 'kb-key ' + finger + (extra ? ' ' + extra : '');
      el.textContent = label;
      el.dataset.key = key;
      rowEl.appendChild(el);
    });
    kb.appendChild(rowEl);
  });
}

function clearHighlight() {
  document.querySelectorAll('.kb-key').forEach(el => {
    el.className = el.className.replace(/\bhl-\S+/g, '').trim();
  });
}

function highlightKey(char) {
  clearHighlight();
  if (!char) return;

  // 特殊キーの直接マッピング
  const SPECIAL_KEY_MAP = {
    ' ': { key: 'space', hl: 'hl-th' },
    '\n': { key: 'enter', hl: 'hl-pr' },
    '-': { key: '-', hl: 'hl-pr' },
    '=': { key: '=', hl: 'hl-pr' },
    '[': { key: '[', hl: 'hl-pr' },
    ']': { key: ']', hl: 'hl-pr' },
    '\\': { key: '\\', hl: 'hl-pr' },
    ';': { key: ';', hl: 'hl-pr' },
    "'": { key: "'", hl: 'hl-pr' },
    ',': { key: ',', hl: 'hl-mr' },
    '.': { key: '.', hl: 'hl-rr' },
    '/': { key: '/', hl: 'hl-pr' },
    '`': { key: '`', hl: 'hl-pl' },
    '1': { key: '1', hl: 'hl-pl' },
    '2': { key: '2', hl: 'hl-rl' },
    '3': { key: '3', hl: 'hl-ml' },
    '4': { key: '4', hl: 'hl-il' },
    '5': { key: '5', hl: 'hl-il' },
    '6': { key: '6', hl: 'hl-ir' },
    '7': { key: '7', hl: 'hl-ir' },
    '8': { key: '8', hl: 'hl-mr' },
    '9': { key: '9', hl: 'hl-rr' },
    '0': { key: '0', hl: 'hl-pr' },
  };

  // 特殊キーの処理
  if (SPECIAL_KEY_MAP[char]) {
    const { key, hl } = SPECIAL_KEY_MAP[char];
    document.querySelectorAll('.kb-key').forEach(el => {
      if (el.dataset.key === key) el.className = el.className + ' ' + hl;
    });
    return;
  }

  const isUpper = char !== char.toLowerCase() && char === char.toUpperCase();
  const isShiftSym = Object.keys(SHIFT_SYMBOLS).includes(char);
  const baseKey = SHIFT_SYMBOLS[char] || char.toLowerCase();
  const needShift = isUpper || isShiftSym;

  document.querySelectorAll('.kb-key').forEach(el => {
    const k = el.dataset.key;
    if (k === baseKey) {
      const finger = KEY_FINGER[char] || KEY_FINGER[baseKey];
      if (finger) el.className = el.className + ' hl-' + finger.replace('f-', '');
    }
    if (needShift && (k === 'shift-l' || k === 'shift-r')) {
      el.className = el.className + ' hl-pl';
    }
  });
}

// ===== データ取得 =====
let allData = {};

function fetchJsonp(url) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    window[cbName] = (data) => {
      delete window[cbName];
      document.body.removeChild(script);
      resolve(data);
    };
    script.onerror = () => {
      delete window[cbName];
      document.body.removeChild(script);
      reject(new Error('JSONP failed'));
    };
    script.src = url + '&callback=' + cbName;
    document.body.appendChild(script);
  });
}

async function fetchSheet(sheetName) {
  const url = GAS_URL + '?sheet=' + encodeURIComponent(sheetName);
  const data = await fetchJsonp(url);
  return data;
}

async function loadAllSheets() {
  document.getElementById('loading').classList.add('show');
  try {
    const sheetNames = await fetchJsonp(GAS_URL + '?');
    for (const name of sheetNames) {
      try {
        allData[name] = await fetchSheet(name);
      } catch(e) {
        allData[name] = [];
      }
    }
  } catch(e) {
    console.error('データ取得エラー:', e);
  }
  document.getElementById('loading').classList.remove('show');
  setupSheetSelect();
}

function setupSheetSelect() {
  const sel = document.getElementById('sheetSelect');
  sel.innerHTML = '';
  Object.keys(allData).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
  onSheetChange();
}

function onSheetChange() {
  const sheetName = document.getElementById('sheetSelect').value;
  const data = allData[sheetName] || [];
  const units = [...new Set(data.map(d => d.unit).filter(u => u))];
  const unitSel = document.getElementById('unitSelect');
  unitSel.innerHTML = '';

  // 「すべて」オプション
  const allOpt = document.createElement('option');
  allOpt.value = '__all__';
  allOpt.textContent = 'すべて';
  unitSel.appendChild(allOpt);

  units.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u;
    opt.textContent = u;
    unitSel.appendChild(opt);
  });

  document.getElementById('startBtn').disabled = data.length === 0;
}

// ===== ローマ字→かな変換テーブル =====
const ROMAJI_TABLE = (() => {
  const t = {};
  // 基本母音
  const V = {a:'あ',i:'い',u:'う',e:'え',o:'お'};
  // 子音マップ
  const C = {
    k:{a:'か',i:'き',u:'く',e:'け',o:'こ'},
    g:{a:'が',i:'ぎ',u:'ぐ',e:'げ',o:'ご'},
    s:{a:'さ',i:'し',u:'す',e:'せ',o:'そ'},
    z:{a:'ざ',i:'じ',u:'ず',e:'ぜ',o:'ぞ'},
    t:{a:'た',i:'ち',u:'つ',e:'て',o:'と'},
    d:{a:'だ',i:'ぢ',u:'づ',e:'で',o:'ど'},
    n:{a:'な',i:'に',u:'ぬ',e:'ね',o:'の'},
    h:{a:'は',i:'ひ',u:'ふ',e:'へ',o:'ほ'},
    b:{a:'ば',i:'び',u:'ぶ',e:'べ',o:'ぼ'},
    p:{a:'ぱ',i:'ぴ',u:'ぷ',e:'ぺ',o:'ぽ'},
    m:{a:'ま',i:'み',u:'む',e:'め',o:'も'},
    y:{a:'や',u:'ゆ',o:'よ'},
    r:{a:'ら',i:'り',u:'る',e:'れ',o:'ろ'},
    w:{a:'わ',i:'ゐ',e:'ゑ',o:'を'},
    f:{a:'ふぁ',i:'ふぃ',u:'ふ',e:'ふぇ',o:'ふぉ'},
    v:{a:'ゔぁ',i:'ゔぃ',u:'ゔ',e:'ゔぇ',o:'ゔぉ'},
  };
  // 拗音
  const YO = {
    ky:{a:'きゃ',u:'きゅ',o:'きょ'}, gy:{a:'ぎゃ',u:'ぎゅ',o:'ぎょ'},
    sy:{a:'しゃ',u:'しゅ',o:'しょ'}, zy:{a:'じゃ',u:'じゅ',o:'じょ'},
    ty:{a:'ちゃ',u:'ちゅ',o:'ちょ'}, dy:{a:'ぢゃ',u:'ぢゅ',o:'ぢょ'},
    ny:{a:'にゃ',u:'にゅ',o:'にょ'}, hy:{a:'ひゃ',u:'ひゅ',o:'ひょ'},
    by:{a:'びゃ',u:'びゅ',o:'びょ'}, py:{a:'ぴゃ',u:'ぴゅ',o:'ぴょ'},
    my:{a:'みゃ',u:'みゅ',o:'みょ'}, ry:{a:'りゃ',u:'りゅ',o:'りょ'},
  };
  // 特殊
  const SP = {
    shi:'し', chi:'ち', tsu:'つ', fu:'ふ',
    sha:'しゃ', shu:'しゅ', sho:'しょ',
    cha:'ちゃ', chu:'ちゅ', cho:'ちょ',
    ja:'じゃ', ji:'じ', ju:'じゅ', jo:'じょ',
    tchi:'っち', ttsu:'っつ',
    nn:'ん', xn:'ん',
    xa:'ぁ', xi:'ぃ', xu:'ぅ', xe:'ぇ', xo:'ぉ',
    xya:'ゃ', xyu:'ゅ', xyo:'ょ',
    xtu:'っ', xtsu:'っ', ltu:'っ', ltsu:'っ',
    wa:'わ', wi:'ゐ', we:'ゑ', wo:'を',
    fa:'ふぁ', fi:'ふぃ', fe:'ふぇ', fo:'ふぉ',
    di:'ぢ', du:'づ', ti:'ち', tu:'つ',
    si:'し', su:'す',
  };
  // 母音
  Object.assign(t, V);
  // 子音+母音
  for (const [c, map] of Object.entries(C)) {
    for (const [v, kana] of Object.entries(map)) t[c+v] = kana;
  }
  // 拗音
  for (const [c, map] of Object.entries(YO)) {
    for (const [v, kana] of Object.entries(map)) t[c+v] = kana;
  }
  // 特殊
  Object.assign(t, SP);
  // 拗音をROMAJI_TABLEにも追加（isPossibleチェック用）
  const youonExtra = {
    'kya':'きゃ','kyu':'きゅ','kyo':'きょ',
    'gya':'ぎゃ','gyu':'ぎゅ','gyo':'ぎょ',
    'sha':'しゃ','shu':'しゅ','sho':'しょ','sya':'しゃ','syu':'しゅ','syo':'しょ',
    'ja':'じゃ','ju':'じゅ','jo':'じょ','jya':'じゃ','jyu':'じゅ','jyo':'じょ',
    'cha':'ちゃ','chu':'ちゅ','cho':'ちょ','tya':'ちゃ','tyu':'ちゅ','tyo':'ちょ',
    'nya':'にゃ','nyu':'にゅ','nyo':'にょ',
    'hya':'ひゃ','hyu':'ひゅ','hyo':'ひょ',
    'bya':'びゃ','byu':'びゅ','byo':'びょ',
    'pya':'ぴゃ','pyu':'ぴゅ','pyo':'ぴょ',
    'mya':'みゃ','myu':'みゅ','myo':'みょ',
    'rya':'りゃ','ryu':'りゅ','ryo':'りょ',

  Object.assign(t, youonExtra);
  // 長音符
  t['-'] = 'ー';
  // ん（次が子音または文末）
  t['n'] = 'ん_pending'; // 特別処理
  return t;
})();

// ローマ字バッファ→かな変換（最長一致・拗音対応）
function romajiToKana(buf) {
  // 促音（同じ子音が重なる場合）
  if (buf.length >= 2 && buf[0] === buf[1] && buf[0] !== 'n' && 'bcdfghjklmpqrstvwxyz'.includes(buf[0])) {
    const rest = romajiToKana(buf.slice(1));
    if (rest !== null) return 'っ' + rest;
  }
  // 最長一致（最大5文字まで拡張：xtsu等）
  for (let len = Math.min(buf.length, 5); len >= 1; len--) {
    const key = buf.slice(0, len);
    if (ROMAJI_TABLE[key] !== undefined && ROMAJI_TABLE[key] !== 'ん_pending') {
      return ROMAJI_TABLE[key];
    }
  }
  return null;
}

// ローマ字バッファが「ん」確定かどうか
function isNConfirmed(buf, nextChar) {
  if (buf === 'n' || buf === 'nn') {
    if (!nextChar || !'aiueoyn'.includes(nextChar)) return true;
  }
  return false;
}

// テキストが日本語（ひらがな・カタカナ・漢字）を含むか判定
function isJapanese(text) {
  return /[\u3040-\u30ff\u4e00-\u9fff]/.test(text);
}

// かな1文字（または拗音2文字）に対応するローマ字パターン一覧
const KANA_ROMAJI = (() => {
  const map = {};
  const entries = Object.entries(ROMAJI_TABLE).filter(([,v]) => v !== 'ん_pending');
  for (const [r, k] of entries) {
    if (!map[k]) map[k] = [];
    if (!map[k].includes(r)) map[k].push(r);
  }
  // ん
  map['ん'] = ['n', 'nn'];
  // っ
  map['っ'] = ['ltu', 'xtu', 'ltsu', 'xtsu'];
  // 長音符
  map['ー'] = ['-'];
  // 拗音複合（2文字を1単位）
  const youon = {
    'きゃ':['kya'],'きゅ':['kyu'],'きょ':['kyo'],
    'ぎゃ':['gya'],'ぎゅ':['gyu'],'ぎょ':['gyo'],
    'しゃ':['sha','sya'],'しゅ':['shu','syu'],'しょ':['sho','syo'],
    'じゃ':['ja','jya','zya'],'じゅ':['ju','jyu','zyu'],'じょ':['jo','jyo','zyo'],
    'ちゃ':['cha','tya'],'ちゅ':['chu','tyu'],'ちょ':['cho','tyo'],
    'にゃ':['nya'],'にゅ':['nyu'],'にょ':['nyo'],
    'ひゃ':['hya'],'ひゅ':['hyu'],'ひょ':['hyo'],
    'びゃ':['bya'],'びゅ':['byu'],'びょ':['byo'],
    'ぴゃ':['pya'],'ぴゅ':['pyu'],'ぴょ':['pyo'],
    'みゃ':['mya'],'みゅ':['myu'],'みょ':['myo'],
    'りゃ':['rya'],'りゅ':['ryu'],'りょ':['ryo'],
    'てぃ':['thi'],'でぃ':['dhi'],
    'ふぁ':['fa'],'ふぃ':['fi'],'ふぇ':['fe'],'ふぉ':['fo'],
  };
  Object.assign(map, youon);
  return map;
})();

// ===== ゲームロジック =====
let sentences = [];
let current = 0, totalErrors = 0, totalTyped = 0, startTime = null, typedCorrect = '';
let isPaused = false;

// 日本語モード用
let romajiBuffer = '';      // 現在入力中のローマ字バッファ
let kanaProgress = [];      // 確定したかな文字の配列（ターゲットかなに対して何文字確定したか）
let targetKana = [];        // ターゲットをかな配列に分解したもの

const inputField = document.getElementById('inputField');

function getCurrentSentences() {
  const sheetName = document.getElementById('sheetSelect').value;
  const unit = document.getElementById('unitSelect').value;
  const data = allData[sheetName] || [];
  if (unit === '__all__') return data;
  return data.filter(d => d.unit === unit);
}

function startGame() {
  sentences = getCurrentSentences();
  if (sentences.length === 0) return;
  sentences = sentences.sort(() => Math.random() - 0.5);
  current = 0; totalErrors = 0; totalTyped = 0; startTime = null; typedCorrect = ''; isPaused = false;
  document.getElementById('wpm').textContent = '0';
  document.getElementById('accuracy').textContent = '100';
  document.getElementById('errors').textContent = '0';
  document.getElementById('selectorWrap').classList.add('hidden');
  document.getElementById('gameArea').classList.remove('hidden');
  document.getElementById('resultCard').classList.remove('show');
  loadSentence();
}

// かな文字列を1文字ずつ配列に分解（拗音は2文字を1単位にしない→1文字ずつ）
// かな文字列を意味単位で分解（拗音は2文字を1単位に）
function splitKana(text) {
  if (!text) return [];
  const small = 'ぁぃぅぇぉゃゅょっァィゥェォャュョッ';
  const result = [];
  const chars = [...text];
  for (let i = 0; i < chars.length; i++) {
    // 次の文字が小文字かな（拗音・促音）の場合は結合
    if (i + 1 < chars.length && small.includes(chars[i + 1]) && chars[i + 1] !== 'っ' && chars[i + 1] !== 'ッ') {
      result.push(chars[i] + chars[i + 1]);
      i++;
    } else {
      result.push(chars[i]);
    }
  }
  return result;
}

// ターゲットが日本語かどうか（F列のreadingで判定）
function currentIsJapanese() {
  const s = sentences[current];
  const reading = s.reading || '';
  // readingが空の場合はdisplayで判定
  const checkText = reading || s.display || s.typing || '';
  return isJapanese(checkText);
}

// ===== 表示系 =====
function renderDisplayText() {
  // C列をdisplay-textエリアに表示（カーソルなし・ルビ付き）
  const s = sentences[current];
  const displayText = s.display || '';
  const el = document.getElementById('displayText');
  if (!displayText) { el.innerHTML = ''; return; }
  const chars = [...displayText];
  let html = '';
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i] === ' ' ? '&nbsp;' : chars[i];
    const ruby = s.ruby ? s.ruby[i] || '' : '';
    if (ruby) {
      html += `<ruby>${ch}<rt>${ruby}</rt></ruby>`;
    } else {
      html += ch;
    }
  }
  el.innerHTML = html;
}

function renderJapanese() {
  // F列（reading）をタイピング判定エリアに表示（カーソルあり）
  const s = sentences[current];
  const readingChars = targetKana;
  const el = document.getElementById('typingDisplay');
  const confirmedCount = kanaProgress.length;
  const bufDisplay = romajiBuffer ? `<span class="romaji-buf">${romajiBuffer}</span>` : '';
  let html = '';
  for (let i = 0; i < readingChars.length; i++) {
    const ch = readingChars[i] === ' ' ? '&nbsp;' : readingChars[i];
    let cls;
    if (i < confirmedCount) cls = 'correct';
    else if (i === confirmedCount) cls = 'pending cursor';
    else cls = 'pending';
    html += `<span class="char ${cls}">${ch}</span>`;
  }
  el.innerHTML = html + bufDisplay;
}

function renderSentence(typed) {
  if (currentIsJapanese()) { renderDisplayText(); renderJapanese(); return; }
  // 英語モード：C列とF列が同じなのでtypingDisplayにF列を表示
  document.getElementById('displayText').innerHTML = '';
  const s = sentences[current];
  const target = s.reading || s.display || s.typing || '';
  const el = document.getElementById('typingDisplay');
  let html = '';
  for (let i = 0; i < target.length; i++) {
    let cls = i < typed.length
      ? (typed[i].toLowerCase() === target[i].toLowerCase() ? 'correct' : 'error')
      : (i === typed.length ? 'pending cursor' : 'pending');
    const ch = target[i] === ' ' ? '&nbsp;' : target[i];
    html += `<span class="char ${cls}">${ch}</span>`;
  }
  el.innerHTML = html;
}

function renderSentenceWithError(correct) {
  if (currentIsJapanese()) { renderDisplayText(); renderJapanese(); return; }
  document.getElementById('displayText').innerHTML = '';
  const s = sentences[current];
  const target = s.reading || s.display || s.typing || '';
  const el = document.getElementById('typingDisplay');
  let html = '';
  for (let i = 0; i < target.length; i++) {
    let cls = i < correct.length ? 'correct' : (i === correct.length ? 'error cursor' : 'pending');
    const ch = target[i] === ' ' ? '&nbsp;' : target[i];
    html += `<span class="char ${cls}">${ch}</span>`;
  }
  el.innerHTML = html;
}

function loadSentence() {
  const s = sentences[current];
  const displayText = s.display || s.typing || '';
  const readingText = s.reading || displayText;
  document.getElementById('sentenceNumber').textContent = `SENTENCE ${String(current + 1).padStart(2, '0')}`;
  document.getElementById('progressFill').style.width = `${(current / sentences.length) * 100}%`;
  document.getElementById('progressLabel').textContent = `${current + 1} / ${sentences.length}`;
  document.getElementById('descriptionText').textContent = s.desc || '';
  inputField.value = '';
  typedCorrect = '';
  romajiBuffer = '';
  kanaProgress = [];
  targetKana = splitKana(readingText);
  renderSentence('');
  if (currentIsJapanese()) {
    const firstKana = targetKana[0];
    const options = KANA_ROMAJI[firstKana];
    if (options && options[0]) highlightKey(options[0][0]);
    else clearHighlight();
  } else {
    highlightKey(displayText[0]);
  }
  inputField.focus();
  const speakText = s.reading || s.display || s.typing || '';
  speak(speakText);
}

function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = isJapanese(text) ? 'ja-JP' : 'en-US';
  utt.rate = 0.85;
  speechSynthesis.speak(utt);
}

function updateStats() {
  if (!startTime) return;
  const elapsed = (Date.now() - startTime) / 60000;
  const wpm = elapsed > 0 ? Math.round(totalTyped / 5 / elapsed) : 0;
  const accuracy = totalTyped > 0 ? Math.round(((totalTyped - totalErrors) / totalTyped) * 100) : 100;
  document.getElementById('wpm').textContent = wpm;
  document.getElementById('accuracy').textContent = accuracy;
  document.getElementById('errors').textContent = totalErrors;
}

function showResult() {
  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('resultCard').classList.add('show');
  const elapsed = (Date.now() - startTime) / 60000;
  const wpm = elapsed > 0 ? Math.round(totalTyped / 5 / elapsed) : 0;
  const accuracy = totalTyped > 0 ? Math.round(((totalTyped - totalErrors) / totalTyped) * 100) : 100;
  document.getElementById('finalWpm').textContent = wpm;
  document.getElementById('finalAccuracy').textContent = accuracy;
  document.getElementById('finalErrors').textContent = totalErrors;
  clearHighlight();
}

// ===== 日本語入力処理 =====
function getNextRomajiHint() {
  const pos = kanaProgress.length;
  if (pos >= targetKana.length) return null;
  const kana = targetKana[pos];
  const options = KANA_ROMAJI[kana];
  if (!options || options.length === 0) return null;
  if (romajiBuffer) {
    const matching = options.find(r => r.startsWith(romajiBuffer));
    if (matching && matching.length > romajiBuffer.length) {
      return matching[romajiBuffer.length];
    }
  }
  return options[0][0] || null;
}

function handleJapaneseKey(key) {
  if (!startTime) startTime = Date.now();
  const chars = targetKana; // loadSentenceでreadingから生成済み
  const pos = kanaProgress.length;
  if (pos >= chars.length) return;
  const expectedKana = chars[pos];

  // スペース処理
  if (expectedKana === ' ' || expectedKana === '　') {
    totalTyped++;
    if (key === ' ') {
      kanaProgress.push(expectedKana);
      romajiBuffer = '';
      renderJapanese();
      highlightKey(getNextRomajiHint());
      checkJapaneseComplete();
    } else {
      totalErrors++;
      flashError();
      renderJapanese();
    }
    updateStats();
    return;
  }

  // バッファにキーを追加
  const newBuf = romajiBuffer + key;

  // 促音（っ）：同子音重ねパターン
  if (expectedKana === 'っ' && newBuf.length >= 2 && newBuf[0] === newBuf[1]) {
    totalTyped++;
    kanaProgress.push('っ');
    romajiBuffer = newBuf.slice(1); // 2文字目以降を次の処理へ
    renderJapanese();
    // 残りバッファを処理
    const remaining = romajiBuffer;
    romajiBuffer = '';
    for (const c of remaining) handleJapaneseKey(c);
    return;
  }

  // 促音（っ）：ltu/xtu等
  if (expectedKana === 'っ') {
    const tsuList = ['ltu','xtu','ltsu','xtsu'];
    const match = tsuList.find(r => r === newBuf);
    if (match) {
      totalTyped++;
      kanaProgress.push('っ');
      romajiBuffer = '';
      renderJapanese();
      highlightKey(getNextRomajiHint());
      checkJapaneseComplete();
      updateStats();
      return;
    }
    if (tsuList.some(r => r.startsWith(newBuf))) {
      totalTyped++;
      romajiBuffer = newBuf;
      renderJapanese();
      updateStats();
      return;
    }
  }

  // ん処理
  if (expectedKana === 'ん') {
    if (newBuf === 'n') {
      const nextKana = chars[pos + 1];
      const nextFirst = nextKana ? (KANA_ROMAJI[nextKana] || ['a'])[0][0] : null;
      if (!nextFirst || !'aiueoyn'.includes(nextFirst)) {
        // 次が母音・y・n以外 → ん確定
        totalTyped++;
        kanaProgress.push('ん');
        romajiBuffer = '';
        renderJapanese();
        highlightKey(getNextRomajiHint());
        checkJapaneseComplete();
        updateStats();
        return;
      }
      // まだ確定できない
      totalTyped++;
      romajiBuffer = newBuf;
      renderJapanese();
      updateStats();
      return;
    }
    if (newBuf === 'nn') {
      totalTyped++;
      kanaProgress.push('ん');
      romajiBuffer = '';
      renderJapanese();
      highlightKey(getNextRomajiHint());
      checkJapaneseComplete();
      updateStats();
      return;
    }
  }

  // 通常変換：最長一致
  const converted = romajiToKana(newBuf);
  if (converted !== null) {
    totalTyped++;
    if (converted === expectedKana) {
      kanaProgress.push(expectedKana);
      romajiBuffer = '';
      renderJapanese();
      highlightKey(getNextRomajiHint());
      checkJapaneseComplete();
    } else {
      totalErrors++;
      flashError();
      romajiBuffer = '';
      renderJapanese();
    }
    updateStats();
    return;
  }

  // 変換途中かチェック（ROMAJI_TABLEとKANA_ROMAJIの全パターンで確認）
  const allRomajiPatterns = [
    ...Object.keys(ROMAJI_TABLE),
    ...Object.values(KANA_ROMAJI).flat()
  ];
  const isPossible = allRomajiPatterns.some(r => r.startsWith(newBuf));
  if (isPossible) {
    totalTyped++;
    romajiBuffer = newBuf;
    renderJapanese();
    highlightKey(getNextRomajiHint());
    updateStats();
  } else {
    // 変換不可能なパターン
    totalTyped++;
    totalErrors++;
    flashError();
    romajiBuffer = '';
    renderJapanese();
    updateStats();
  }
}

function checkJapaneseComplete() {
  if (kanaProgress.length >= targetKana.length) {
    clearHighlight();
    inputField.classList.add('flash-correct');
    setTimeout(() => {
      inputField.classList.remove('flash-correct');
      romajiBuffer = '';
      kanaProgress = [];
      current++;
      if (current >= sentences.length) showResult();
      else loadSentence();
    }, 300);
  }
}

function flashError() {
  inputField.classList.add('has-error');
  setTimeout(() => inputField.classList.remove('has-error'), 150);
}

inputField.addEventListener('keydown', (e) => {
  if (isPaused) return;
  if (e.key === 'Escape') {
    const s = sentences[current];
    speak(s.reading || s.display || s.typing || '');
    return;
  }
  if (e.key.length !== 1) return;
  e.preventDefault();
  if (!startTime) startTime = Date.now();

  // 日本語モード
  if (currentIsJapanese()) {
    handleJapaneseKey(e.key.toLowerCase());
    return;
  }

  // 英語モード：F列（reading）で判定
  const target = sentences[current].reading || sentences[current].display || sentences[current].typing || '';
  if (!target) return;
  const pos = typedCorrect.length;
  if (pos >= target.length) return;

  const expectedChar = target[pos];
  totalTyped++;

  if (e.key.toLowerCase() === expectedChar.toLowerCase()) {
    typedCorrect += expectedChar;
    inputField.value = typedCorrect;
    renderSentence(typedCorrect);
    const nextChar = target[typedCorrect.length];
    highlightKey(nextChar !== undefined ? nextChar : null);

    if (typedCorrect.toLowerCase() === target.toLowerCase()) {
      clearHighlight();
      inputField.classList.add('flash-correct');
      setTimeout(() => {
        inputField.classList.remove('flash-correct');
        typedCorrect = '';
        current++;
        if (current >= sentences.length) showResult();
        else loadSentence();
      }, 300);
    }
  } else {
    totalErrors++;
    inputField.classList.add('has-error');
    setTimeout(() => inputField.classList.remove('has-error'), 150);
    renderSentenceWithError(typedCorrect);
    setTimeout(() => renderSentence(typedCorrect), 300);
  }
  updateStats();
});

function goToSelector() {
  isPaused = false;
  document.getElementById('pauseOverlay').classList.add('hidden');
  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('selectorWrap').classList.remove('hidden');
  clearHighlight();
  speechSynthesis.cancel();
}

// 一時停止
document.getElementById('pauseBtn').addEventListener('click', () => {
  isPaused = true;
  speechSynthesis.cancel();
  document.getElementById('pauseOverlay').classList.remove('hidden');
  inputField.blur();
});

// 再開
document.getElementById('resumeBtn').addEventListener('click', () => {
  isPaused = false;
  document.getElementById('pauseOverlay').classList.add('hidden');
  inputField.focus();
});

// 一時停止後→分野選択に戻る
document.getElementById('pauseBackBtn').addEventListener('click', goToSelector);

// 直接→分野選択に戻る
document.getElementById('backToSelectBtn').addEventListener('click', goToSelector);

document.getElementById('audioBtn').addEventListener('click', () => {
  const s = sentences[current];
  speak(s.reading || s.display || s.typing || '');
});
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('sheetSelect').addEventListener('change', onSheetChange);

document.getElementById('retryBtn').addEventListener('click', () => {
  document.getElementById('resultCard').classList.remove('show');
  startGame();
});

document.getElementById('backBtn').addEventListener('click', goToSelector);

// ===== 初期化 =====
buildKeyboard();
loadAllSheets();
</script>
</body>
</html>
